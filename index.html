
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131218">
<meta name="color-scheme" content="dark light">
<title>Sam</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">Sam</div>

    <button class="new-chat" id="newChat" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      New chat
    </button>

    <button class="memory-nav" id="openMemory" type="button">
      <span aria-hidden="true">◈</span> Memory
    </button>

    <button class="memory-nav" id="openSettings" type="button">
      <span aria-hidden="true">⚙</span> Settings
    </button>

    <div class="sidebar-label">RECENTS</div>
    <nav class="chat-list" id="chatList"></nav>

    <div class="side-foot">
      <span class="status"></span>Online · v0.3 beta
    </div>
  </aside>

  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="toggleSide" type="button" aria-label="Toggle sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M4 7h16M4 12h16M4 17h10"/>
        </svg>
      </button>

      <span class="title">Sam <span class="badge">v0.3 beta</span></span>
    </header>

    <section class="scroller" id="scroller">
      <div class="thread" id="thread"></div>
    </section>

    <footer class="dock" id="dock">
      <form class="composer" id="form">
        <textarea id="input" rows="1" placeholder="Message Sam" autofocus></textarea>

        <button class="send" id="send" type="submit" aria-label="Send" disabled>
          <svg class="ico-send" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19V5M5 12l7-7 7 7"/>
          </svg>

          <svg class="ico-stop" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="6" width="12" height="12" rx="2.5"/>
          </svg>
        </button>
      </form>

      <p class="hint">Sam can make mistakes.</p>
    </footer>
  </main>
</div>

<!-- Load Settings before the main application -->
<script src="/settings.js"></script>
<script src="/script.js"></script>

</body>
</html>
